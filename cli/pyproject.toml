[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simple-ai"
version = "0.1.0"
description = "Pose le dossier simple-ai/ dans ton repo (workflow PO/DEV piloté par IA)."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
# Zéro dépendance runtime — stdlib only (garde-fou « simple »).
dependencies = []

[project.scripts]
# uvx simple-ai init  →  simple_ai.cli:main
simple-ai = "simple_ai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["simple_ai"]

# _kit/ est un SNAPSHOT de ../kit synchronisé au build (sync-kit.sh), gitignoré (source
# unique = kit/). On force son inclusion dans le paquet bien qu'il soit git-ignoré.
[tool.hatch.build.targets.wheel.force-include]
"simple_ai/_kit" = "simple_ai/_kit"

[tool.hatch.build.targets.sdist]
include = ["simple_ai", "README.md"]
